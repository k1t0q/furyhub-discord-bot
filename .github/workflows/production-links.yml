name: Update Discord production links
on:
  push:
    branches: [scum-hub-migration]
    paths: ['.github/workflows/production-links.yml']
  workflow_dispatch:
concurrency:
  group: discord-d1-migration-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy migration bot and verify connections
        env:
          SSH_HOST: ${{ secrets.TIMEWEB_HOST }}
          SSH_USER: ${{ secrets.TIMEWEB_USER }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          SSH_PORT: ${{ secrets.TIMEWEB_PORT }}
          D1_TOKEN: ${{ secrets.SCUM_CLOUDFLARE_API_TOKEN }}
          IMAGEKIT_KEY: ${{ secrets.SCUM_IMAGEKIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          test -z "$D1_TOKEN" && echo "D1 credential: unavailable in bot repository" || echo "D1 credential: available"
          test -z "$IMAGEKIT_KEY" && echo "ImageKit credential: unavailable in bot repository" || echo "ImageKit credential: available"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/migration_key
          chmod 600 ~/.ssh/migration_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          printf '%s' '' | ssh -i ~/.ssh/migration_key -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration configure'
          ssh -i ~/.ssh/migration_key -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'set -eu; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration activate; sleep 3; if ! curl -fsS --max-time 30 http://127.0.0.1:3000/health; then sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration rollback; exit 1; fi; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration status'
