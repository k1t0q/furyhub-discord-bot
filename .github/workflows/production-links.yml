name: Build mini-map and update Discord
# Approved release v1.5: bounded diagnostic messages and reliable position delivery
on:
  push:
    branches: [scum-hub-migration]
    paths: ['.github/workflows/production-links.yml']
  workflow_dispatch:
concurrency:
  group: discord-d1-migration-deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SCUM_HUB_MiniMap_V1.5
          run-id: 42296495859
          github-token: ${{ github.token }}
          path: verified-release
      - name: Prepare Windows-tested release
        run: |
          set -euo pipefail
          cp verified-release/SCUM_HUB_MiniMap_V1.5.exe minimap/SCUM_HUB_MiniMap.exe
          sha256sum minimap/SCUM_HUB_MiniMap.exe
          node --check src/server.js
      - name: Deploy menu and executable
        env:
          SSH_HOST: ${{ secrets.TIMEWEB_HOST }}
          SSH_USER: ${{ secrets.TIMEWEB_USER }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          SSH_PORT: ${{ secrets.TIMEWEB_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/migration_key
          chmod 600 ~/.ssh/migration_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          scp -i ~/.ssh/migration_key -P "$PORT" minimap/SCUM_HUB_MiniMap.exe "$SSH_USER@$SSH_HOST:/tmp/SCUM_HUB_MiniMap.exe"
          ssh -i ~/.ssh/migration_key -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'set -eu; test -s /tmp/SCUM_HUB_MiniMap.exe; chmod 644 /tmp/SCUM_HUB_MiniMap.exe; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration prepare; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration activate; sleep 3; curl -fsS --retry 5 --retry-delay 3 --max-time 30 http://127.0.0.1:3000/health; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration status; minimap_bot_dir=$(systemctl show scum-hub-bot -p WorkingDirectory --value); test -n "$minimap_bot_dir"; cmp /tmp/SCUM_HUB_MiniMap.exe "$minimap_bot_dir/minimap/SCUM_HUB_MiniMap.exe"; sha256sum "$minimap_bot_dir/minimap/SCUM_HUB_MiniMap.exe"'

# Publish Windows-tested v1.5 through the existing Discord menu.
