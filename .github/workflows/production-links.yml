name: Build mini-map and update Discord
# Approved release: visible HUB code, standard unclipped checkbox and automatic tracking default
on:
  push:
    branches: [scum-hub-migration]
    paths: ['.github/workflows/production-links.yml']
  workflow_dispatch:
concurrency:
  group: discord-d1-migration-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs libmono-system-windows-forms4.0-cil libmono-system-net-http4.0-cil libmono-system-web-extensions4.0-cil python3-pil python3-numpy python3-scipy fonts-dejavu-core
          python3 minimap/build-map.py
          python3 minimap/build-road-graph.py
          python3 minimap/build-windows.py
          mono minimap/SCUM_HUB_MiniMap.exe --self-test
          cat minimap/self-test.txt
          sha256sum minimap/SCUM_HUB_MiniMap.exe
          node --check src/server.js
      - name: Deploy menu and executable
        env:
          SSH_HOST: ${{ secrets.TIMEWEB_HOST }}
          SSH_USER: ${{ secrets.TIMEWEB_USER }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          SSH_PORT: ${{ secrets.TIMEWEB_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/migration_key
          chmod 600 ~/.ssh/migration_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          scp -i ~/.ssh/migration_key -P "$PORT" minimap/SCUM_HUB_MiniMap.exe "$SSH_USER@$SSH_HOST:/tmp/SCUM_HUB_MiniMap.exe"
          ssh -i ~/.ssh/migration_key -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'set -eu; test -s /tmp/SCUM_HUB_MiniMap.exe; chmod 644 /tmp/SCUM_HUB_MiniMap.exe; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration prepare; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration activate; sleep 3; curl -fsS --max-time 30 http://127.0.0.1:3000/health; sudo -n /usr/local/sbin/deploy-scum-hub-bot-migration status; minimap_bot_dir=$(systemctl show scum-hub-bot -p WorkingDirectory --value); test -n "$minimap_bot_dir"; cmp /tmp/SCUM_HUB_MiniMap.exe "$minimap_bot_dir/minimap/SCUM_HUB_MiniMap.exe"; sha256sum "$minimap_bot_dir/minimap/SCUM_HUB_MiniMap.exe"'
