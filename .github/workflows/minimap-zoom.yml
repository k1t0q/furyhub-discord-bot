name: Build mini-map v1.1 zoom update
on:
  push:
    branches: [feature/minimap-zoom-v1.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs libmono-system-windows-forms4.0-cil libmono-system-net-http4.0-cil libmono-system-web-extensions4.0-cil python3-pil python3-numpy python3-scipy fonts-dejavu-core xvfb libgdiplus
          python3 minimap/build-map.py
          python3 minimap/build-road-graph.py
          python3 minimap/build-windows.py
          cd minimap
          mono SCUM_HUB_MiniMap.exe --self-test
          xvfb-run -a mono SCUM_HUB_MiniMap.exe --ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: minimap-v1.1-exe
          path: minimap/SCUM_HUB_MiniMap.exe
  windows-ui:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minimap-v1.1-exe
      - name: Check Windows UI
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./SCUM_HUB_MiniMap.exe -ArgumentList '--ui-test' -Wait -PassThru
          Get-Content ui-test.txt
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimap-v1.1-ui
          path: |
            ui-preview-*.png
            ui-test.txt
